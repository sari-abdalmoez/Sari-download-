name: Build SARI Downloader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370"

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "===== PROJECT ====="
          find . -maxdepth 4 -type f | sort

          echo
          echo "===== JAVA ====="
          java -version

          echo
          echo "===== GRADLE FILES ====="
          cat settings.gradle
          echo
          cat build.gradle
          echo
          cat app/build.gradle

      - name: Install compatible Gradle
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --version || true
          else
            sudo apt-get update
            sudo apt-get install -y gradle
            gradle --version
            gradle wrapper --gradle-version 9.6.0
            chmod +x gradlew
          fi

      - name: Validate Gradle environment
        shell: bash
        run: |
          set -e
          ./gradlew --version
          ./gradlew tasks --stacktrace

      - name: Build APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SARI-Downloader-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
